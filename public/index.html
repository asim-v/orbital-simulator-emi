<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Órbitas JS</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            /* Evita barras de scroll */
            background-color: #000;
            color: white;
            font-family: sans-serif;
        }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            /* Deja pasar los clicks al canvas si es necesario */
        }

        canvas {
            display: block;
            /* Quita márgenes extraños */
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

    <div id="ui-layer">
        <h1 >Simulador Orbital</h1>
    </div>
    <div id="inspector-panel">
        <h2>Control de Misión</h2>

        <div class="panel-section">
            <button id="btn-add-planet">➕ Nuevo Planeta</button>
            <button id="btn-pause">⏸️ Pausar / Reanudar</button>
        </div>

        <div id="selection-controls" style="display: none;">
            <h3>Propiedades</h3>

            <div class="control-group">
                <label>Masa:</label>
                <input type="number" id="inp-mass" step="10" min="1">
            </div>

            <div class="control-group">
                <label>Color:</label>
                <input type="color" id="inp-color">
            </div>

            <div class="control-group">
                <label>Radio:</label>
                <input type="range" id="inp-radius" min="1" max="50">
            </div>

            <button id="btn-delete" class="danger">🗑️ Eliminar Cuerpo</button>
        </div>

        <div id="no-selection">
            <p>Haz clic en un planeta para editarlo.</p>
        </div>
    </div>
    <canvas id="simCanvas"></canvas>

    <script type="module" src="./src/main.js"></script>

</body>

</html>
